# watchlist_config.py
# ─────────────────────────────────────────────────────────────────
# THE single source of truth for all symbols.
# Zero hardcoded symbols anywhere in this file.
#
# Usage in any layer:
#   from watchlist_config import get_symbols, get_sector_map, load_watchlist
# ─────────────────────────────────────────────────────────────────

from __future__ import annotations
import io, os, json
from pathlib import Path
import pandas as pd
import requests
from dotenv import load_dotenv

load_dotenv(dotenv_path="/workspaces/algo-ensemble/.env")

GSHEET_ID  = os.getenv("WATCHLIST_GSHEET_ID", "")
GSHEET_GID = os.getenv("WATCHLIST_GSHEET_GID", "0")
LOCAL_CSV  = Path("data/watchlist_master.csv")
CACHE_JSON = Path("data/cache/watchlist_snapshot.json")


def _gsheet_url() -> str:
    return (
        f"https://docs.google.com/spreadsheets/d/{GSHEET_ID}"
        f"/export?format=csv&gid={GSHEET_GID}"
    )


def _read_raw() -> pd.DataFrame | None:
    # 1. Google Sheets (live)
    if GSHEET_ID:
        try:
            r = requests.get(_gsheet_url(), timeout=10)
            r.raise_for_status()
            df = pd.read_csv(io.StringIO(r.text))
            df.columns = [c.strip().lower() for c in df.columns]
            # Mirror to local CSV as fallback
            os.makedirs(LOCAL_CSV.parent, exist_ok=True)
            df.to_csv(LOCAL_CSV, index=False)
            return df
        except Exception as e:
            print(f"  [Watchlist] GSheets unavailable ({e}), trying local CSV...")

    # 2. Local CSV
    if LOCAL_CSV.exists():
        df = pd.read_csv(LOCAL_CSV)
        df.columns = [c.strip().lower() for c in df.columns]
        print(f"  [Watchlist] Loaded from local CSV ({LOCAL_CSV})")
        return df

    # 3. Last cached snapshot
    if CACHE_JSON.exists():
        print("  [Watchlist] WARNING — using stale cached snapshot")
        return pd.read_json(CACHE_JSON)

    return None


def load_watchlist(active_only: bool = True) -> pd.DataFrame:
    """
    Returns DataFrame with columns:
      symbol | active | sector | industry | notes

    'symbol' column is mandatory in the sheet.
    All other columns use safe defaults if missing.
    """
    df = _read_raw()

    if df is None or df.empty:
        raise RuntimeError(
            "\n[Watchlist] No watchlist found. Do ONE of:\n"
            "  Option A: Set WATCHLIST_GSHEET_ID in .env (Google Sheets)\n"
            "  Option B: Create data/watchlist_master.csv with a 'symbol' column\n"
            "            and add your NSE symbols (e.g. ABB-EQ) one per row.\n"
        )

    if "symbol" not in df.columns:
        raise ValueError(
            "[Watchlist] Sheet must have a column named 'symbol' in the first row."
        )

    # Drop blank symbol rows
    df = df[df["symbol"].notna() & (df["symbol"].astype(str).str.strip() != "")].copy()
    df["symbol"] = df["symbol"].str.strip().str.upper()

    # Safe defaults — no hardcoded values
    if "active" not in df.columns:
        df["active"] = "TRUE"
    if "sector" not in df.columns:
        df["sector"] = ""
    if "industry" not in df.columns:
        df["industry"] = ""
    if "notes" not in df.columns:
        df["notes"] = ""

    # Normalise active flag
    df["active"] = (
        df["active"].astype(str).str.strip().str.upper()
        .isin(["TRUE", "YES", "1", "Y", "ACTIVE"])
    )
    df["sector"] = df["sector"].astype(str).str.strip().str.upper().replace("NAN", "")

    # Cache snapshot for offline fallback
    os.makedirs(CACHE_JSON.parent, exist_ok=True)
    df.to_json(CACHE_JSON, orient="records", indent=2)

    if active_only:
        before = len(df)
        df = df[df["active"]].reset_index(drop=True)
        print(f"  [Watchlist] {len(df)} active / {before} total symbols loaded")
    else:
        print(f"  [Watchlist] {len(df)} symbols loaded (including inactive)")

    return df[["symbol", "active", "sector", "industry", "notes"]]


def get_symbols(active_only: bool = True) -> list[str]:
    """Return plain list of symbol strings. Most layers use this."""
    return load_watchlist(active_only=active_only)["symbol"].tolist()


def get_sector_map(active_only: bool = True) -> dict[str, str]:
    """Return {symbol: sector} dict."""
    df = load_watchlist(active_only=active_only)
    return dict(zip(df["symbol"], df["sector"]))


if __name__ == "__main__":
    df = load_watchlist(active_only=False)
    print(df.to_string(index=False))
